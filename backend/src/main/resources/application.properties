server.port=8080

spring.application.name=portfolio-pro-backend

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfoliopro?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Market Data Configuration (Twelve Data provider)
market.data.provider=twelvedata
market.data.base-url=${MARKET_DATA_BASE_URL:https://api.twelvedata.com}
market.data.api-key=${MARKET_DATA_API_KEY:}
market.data.connect-timeout-ms=${MARKET_DATA_CONNECT_TIMEOUT_MS:3000}
market.data.read-timeout-ms=${MARKET_DATA_READ_TIMEOUT_MS:5000}
market.data.cache-ttl-seconds=${MARKET_DATA_CACHE_TTL_SECONDS:60}

