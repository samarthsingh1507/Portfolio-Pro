server.port=8080
spring.application.name=portfolio-pro-backend-test

# Test In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT Secret
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Test Market Data Configuration
market.data.provider=twelvedata
market.data.base-url=http://localhost:8089
market.data.api-key=test-api-key
market.data.connect-timeout-ms=1000
market.data.read-timeout-ms=2000
market.data.cache-ttl-seconds=15

